<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" role="img" aria-labelledby="hero-dark-title">
  <title id="hero-dark-title">TTTIM / skills — Publication-grade AI Agent skills, authored once for every coding agent</title>
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="176" fill="#0d1117"/>
  <rect width="840" height="176" fill="url(#paperGlow)"/>

  <!-- Top calibrated editorial rule -->
  <line x1="60" y1="20" x2="780" y2="20" stroke="#26303c" stroke-width="1"/>
  <g stroke="#303943" stroke-width="1">
    <line x1="60" y1="20" x2="60" y2="26"/>
    <line x1="240" y1="20" x2="240" y2="24"/>
    <line x1="420" y1="20" x2="420" y2="25"/>
    <line x1="600" y1="20" x2="600" y2="24"/>
    <line x1="780" y1="20" x2="780" y2="26"/>
  </g>

  <!-- Eyebrow with flanking hairlines (no boxy pill) -->
  <g transform="translate(420, 46)">
    <line x1="-148" y1="-3.5" x2="-108" y2="-3.5" stroke="#303943" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="#8b949e">CURATED AGENT SKILLS</text>
    <line x1="108" y1="-3.5" x2="148" y2="-3.5" stroke="#303943" stroke-width="1"/>
  </g>

  <!-- Editorial title -->
  <text x="420" y="100" text-anchor="middle" fill="#f0f3f6">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" font-weight="400" letter-spacing="-0.4">TTTIM</tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="34" font-weight="300" fill="#484f58">  /  </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="40" font-weight="600" letter-spacing="-0.9">skills</tspan>
  </text>

  <!-- Calm 1-line subtitle -->
  <text x="420" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">
    Publication-grade design &amp; document workflows, authored once for every coding agent
  </text>

  <!-- Bottom calibrated editorial rule -->
  <line x1="60" y1="158" x2="780" y2="158" stroke="#26303c" stroke-width="1"/>
  <g stroke="#303943" stroke-width="1">
    <line x1="60" y1="152" x2="60" y2="158"/>
    <line x1="420" y1="153" x2="420" y2="158"/>
    <line x1="780" y1="152" x2="780" y2="158"/>
  </g>
</svg>
