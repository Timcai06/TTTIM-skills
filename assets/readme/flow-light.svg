<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 264" width="840" height="264" role="img" aria-labelledby="flow-light-title">
  <title id="flow-light-title">Single-source skill distribution architecture: Timcai06/TTTIM-skills distributes skills/TTT-*-skill via npx skills CLI, Claude Code marketplace.json, and install.sh symlinks to Claude Code, Antigravity/Gemini, Codex, Shared Agents, and Cursor</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 4 L 1 6.5" fill="none" stroke="#0969da" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="840" height="264" fill="#ffffff"/>

  <!-- Header eyebrow -->
  <text x="420" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#768390">SINGLE-SOURCE DISTRIBUTION · 3 CHANNELS → MULTI-AGENT RUNTIME</text>

  <!-- LEFT COLUMN: Single Source Repo (x=30..254, w=224) -->
  <g>
    <rect x="30" y="44" width="224" height="200" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-opacity="0.36" stroke-width="1.2"/>
    <text x="44" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.1" fill="#0969da">SOURCE OF TRUTH</text>
    <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">TTTIM-skills Repo</text>
    <line x1="44" y1="100" x2="240" y2="100" stroke="#d8dee4" stroke-width="1"/>

    <!-- Tree items -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <rect x="44" y="112" width="196" height="44" rx="6" fill="#f0f4f7" stroke="#d8dee4" stroke-width="1"/>
      <text x="54" y="130" fill="#1f2328" font-size="10.5" font-weight="600">skills/TTT-*-skill/</text>
      <text x="54" y="146" fill="#57606a" font-size="10">SKILL.md + references/</text>

      <text x="46" y="176" fill="#0969da" font-size="10">·</text>
      <text x="55" y="176" fill="#57606a" font-size="9.5">.claude-plugin/marketplace.json</text>

      <text x="46" y="198" fill="#0969da" font-size="10">·</text>
      <text x="55" y="198" fill="#57606a" font-size="9.5">install.sh (ln -sfn)</text>

      <text x="46" y="220" fill="#0969da" font-size="10">·</text>
      <text x="55" y="220" fill="#57606a" font-size="9.5">AGENTS.md ← CLAUDE.md</text>
    </g>
  </g>

  <!-- MIDDLE COLUMN: 3 Distribution Channels (x=284..536, w=252) -->
  <!-- Channel 1: npx skills -->
  <g>
    <rect x="284" y="44" width="252" height="58" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.1"/>
    <text x="298" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">01 · Universal CLI</text>
    <text x="298" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#0969da">npx skills add Timcai06/TTTIM-skills</text>
  </g>

  <!-- Channel 2: Claude Code Marketplace -->
  <g>
    <rect x="284" y="115" width="252" height="58" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.1"/>
    <text x="298" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">02 · Claude Marketplace</text>
    <text x="298" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#0969da">/plugin marketplace add <tspan fill="#768390">(manifest)</tspan></text>
  </g>

  <!-- Channel 3: Local Symlink Sync -->
  <g>
    <rect x="284" y="186" width="252" height="58" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-opacity="0.34" stroke-width="1.1"/>
    <text x="298" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">03 · Local Dev Symlink</text>
    <text x="298" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#0969da">./install.sh → 4 local skill dirs</text>
  </g>

  <!-- RIGHT COLUMN: Multi-Agent Targets (x=566..810, w=244) -->
  <g>
    <rect x="566" y="44" width="244" height="200" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.1"/>
    <text x="580" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.1" fill="#768390">AGENT RUNTIMES</text>
    <text x="580" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Synced Skill Paths</text>
    <line x1="580" y1="100" x2="796" y2="100" stroke="#d8dee4" stroke-width="1"/>

    <!-- Target rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5">
      <rect x="580" y="110" width="216" height="24" rx="5" fill="#f0f4f7" stroke="#d8dee4" stroke-width="0.9"/>
      <text x="588" y="125.5" fill="#0969da">~/.claude/skills</text>
      <text x="788" y="125.5" text-anchor="end" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Claude Code</text>

      <rect x="580" y="140" width="216" height="24" rx="5" fill="#f0f4f7" stroke="#d8dee4" stroke-width="0.9"/>
      <text x="588" y="155.5" fill="#0969da">~/.gemini/config/skills</text>
      <text x="788" y="155.5" text-anchor="end" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Antigravity</text>

      <rect x="580" y="170" width="216" height="24" rx="5" fill="#f0f4f7" stroke="#d8dee4" stroke-width="0.9"/>
      <text x="588" y="185.5" fill="#0969da">~/.codex/skills</text>
      <text x="788" y="185.5" text-anchor="end" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Codex</text>

      <rect x="580" y="200" width="216" height="32" rx="5" fill="#f0f4f7" stroke="#d8dee4" stroke-width="0.9"/>
      <text x="588" y="214.5" fill="#0969da">~/.agents/skills</text>
      <text x="788" y="214.5" text-anchor="end" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Shared</text>
      <text x="588" y="226.5" fill="#768390" font-size="9">+ Cursor &amp; others via npx skills</text>
    </g>
  </g>

  <!-- CONNECTORS: Left -> Middle -->
  <g fill="none" stroke="#0969da" stroke-opacity="0.60" stroke-width="1.2">
    <path d="M 254 144 H 268 V 73 H 280" marker-end="url(#arrow)"/>
    <path d="M 254 144 H 280" marker-end="url(#arrow)"/>
    <path d="M 254 144 H 268 V 215 H 280" marker-end="url(#arrow)"/>
  </g>

  <!-- CONNECTORS: Middle -> Right -->
  <g fill="none" stroke="#0969da" stroke-opacity="0.60" stroke-width="1.2">
    <path d="M 536 73 H 550 V 144 H 562" marker-end="url(#arrow)"/>
    <path d="M 536 144 H 562" marker-end="url(#arrow)"/>
    <path d="M 536 215 H 550 V 144"/>
  </g>
</svg>
