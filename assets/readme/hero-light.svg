<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 184" width="840" height="184" role="img" aria-labelledby="hero-light-title">
  <title id="hero-light-title">TTTIM-skills — Personal AI Agent Skills Collection, single-source distribution across Claude Code, Antigravity, Codex, and Cursor</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#0969da" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vertFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="840" height="184"/>
    </clipPath>
  </defs>

  <!-- 1. Solid GitHub light canvas -->
  <rect width="840" height="184" fill="#ffffff"/>

  <!-- 2. Subtle project-derived accent glow -->
  <rect width="840" height="184" fill="url(#glow)"/>

  <!-- 3. Background motif: coordinate dot grid + minimal distribution rails -->
  <g clip-path="url(#canvasClip)">
    <rect width="840" height="184" fill="url(#dotGrid)" opacity="0.75"/>

    <!-- Minimal horizontal routing rails -->
    <g stroke="#d8dee4" stroke-width="1" fill="none" opacity="0.95">
      <path d="M 48 92 H 214"/>
      <path d="M 626 92 H 792"/>
      <path d="M 92 64 H 174 L 194 92"/>
      <path d="M 92 120 H 174 L 194 92"/>
      <path d="M 748 64 H 666 L 646 92"/>
      <path d="M 748 120 H 666 L 646 92"/>
    </g>
    <!-- Routing nodes -->
    <g fill="#ffffff" stroke="#0969da" stroke-opacity="0.45" stroke-width="1.2">
      <circle cx="92" cy="64" r="3"/>
      <circle cx="48" cy="92" r="3"/>
      <circle cx="92" cy="120" r="3"/>
      <circle cx="748" cy="64" r="3"/>
      <circle cx="792" cy="92" r="3"/>
      <circle cx="748" cy="120" r="3"/>
    </g>
    <g fill="#0969da" fill-opacity="0.50">
      <rect x="191.5" y="89.5" width="5" height="5" transform="rotate(45 194 92)"/>
      <rect x="643.5" y="89.5" width="5" height="5" transform="rotate(45 646 92)"/>
    </g>

    <!-- Soft edge fades -->
    <rect width="840" height="184" fill="url(#edgeFade)"/>
    <rect width="840" height="184" fill="url(#vertFade)"/>
  </g>

  <!-- 4. Top eyebrow pill -->
  <g transform="translate(420, 34)">
    <rect x="-148" y="-11" width="296" height="22" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-opacity="0.34" stroke-width="1"/>
    <text x="0" y="3.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#0969da">AGENTSKILLS.IO · MULTI-AGENT REPO</text>
  </g>

  <!-- 5. Centered editorial title -->
  <text x="420" y="106" text-anchor="middle" fill="#1f2328">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="40" font-weight="400" letter-spacing="-0.5">TTTIM</tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="300" fill="#768390"> / </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.8">skills</tspan>
  </text>

  <!-- 6. 1-line subtitle -->
  <text x="420" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">
    Single-source AI Agent skills — authored once, distributed to every local agent
  </text>

  <!-- 7. Bottom hairline rule -->
  <line x1="120" y1="172" x2="720" y2="172" stroke="#d8dee4" stroke-width="1"/>
</svg>
